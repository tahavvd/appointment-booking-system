<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Scissors -->
  <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- blades -->
    <path d="M23 41 L38 14"/>
    <path d="M41 41 L26 14"/>
    <!-- handles -->
    <circle cx="21" cy="46" r="6.5"/>
    <circle cx="43" cy="46" r="6.5"/>
  </g>

  <!-- Pivot -->
  <circle cx="32" cy="24.8" r="2.6" fill="#ffffff"/>
  <circle cx="32" cy="24.8" r="1" fill="#0f766e"/>
</svg>
